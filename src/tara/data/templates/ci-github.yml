# Tara's opinionated CI starter. It runs the same gate as `tara check`
# (lint, format, types, tests, dependency audit) on every push and pull request.
#
# Security conventions modelled here (see the `securing-github-actions` skill):
#   - least-privilege `permissions` (read-only by default),
#   - third-party actions pinned to a full commit SHA (comment shows the tag),
#   - `persist-credentials: false` so the checkout token is not left on disk,
#   - `concurrency` cancels superseded runs, and every job has a timeout.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Type-check
        run: uv run ty check .

      - name: Test
        run: uv run pytest --tb=short

      - name: Audit dependencies
        run: uv audit --preview-features audit-command
