name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the checks only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (lint, format, types, tests, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv (pinned Python comes from .python-version)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      # Dogfood the same gate developers run locally (see src/tara/data/checks/python.toml).
      - name: Run the check gate
        run: uv run tara check

  pre-commit:
    name: pre-commit (secrets, workflow lint, hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      # ruff/ruff-format/ty already run in the gate job; here we add the hooks it
      # does not cover: gitleaks, actionlint, zizmor, and file hygiene.
      - name: Run pre-commit hooks
        env:
          SKIP: ruff,ruff-format,ty
        run: uv run pre-commit run --all-files --show-diff-on-failure
