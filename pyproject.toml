[project]
name = "wingman"
version = "0.1.0"
description = "A GitHub Copilot guardrail toolkit: install instructions, MCP config, and skills, and run a check gate."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
]

[project.scripts]
wingman = "wingman.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.19",
    "ty>=0.0.56",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# Vendored skill scripts (installed by `wingman skill add`) are third-party
# code, not ours to lint or format.
extend-exclude = [".github/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# `scripts/` holds standalone helpers (e.g. gen_cli_docs) that tests import
# after adding the dir to sys.path; tell ty to resolve modules there too.
extra-paths = ["scripts"]
